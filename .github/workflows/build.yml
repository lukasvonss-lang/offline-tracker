name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.2'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install flet pillow
          flutter doctor

      - name: Build APK
        run: |
          flet pack main.py --android
          ls -R dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/**/*.apk
          if-no-files-found: error
