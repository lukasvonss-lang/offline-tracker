name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flet
        run: pip install flet==1.0.3 pillow
      - name: Accept licenses
        run: yes | flutter doctor --android-licenses
      - name: Build APK
        run: echo y | flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/apk
